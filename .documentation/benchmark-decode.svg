<svg xmlns="http://www.w3.org/2000/svg" width="715" height="306" viewBox="0 0 715 306">
<style>
  text { font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .head { font-weight: 600; }
  .head-row { fill: #f6f8fa; }
  .faster { fill: #dafbe1; }
  .slower { fill: #ffebe9; }
  .line { stroke: #d1d9e0; stroke-width: 1; }
  .frame { fill: none; stroke: #d1d9e0; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    text { fill: #f0f6fc; }
    .head-row { fill: #151b23; }
    .faster { fill: #12261e; }
    .slower { fill: #25171c; }
    .line, .frame { stroke: #3d444d; }
  }
</style>
